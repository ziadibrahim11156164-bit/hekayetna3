<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عداد ذكرياتنا ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            min-height: 100vh;
            background-color: #ffb6c1;
            font-family: 'Almarai', sans-serif;
            text-align: center;
            color: #ffffff;
        }
        .container {
            background: #ffb6c1;
            padding: 20px;
            width: 100%;
            min-height: 100vh;
            max-width: 100%;
            border-radius: 0;
            box-shadow: none;
            border: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        h1 {
            font-size: 21px;
            margin-bottom: 10px;
            color: #000000;
            font-weight: 700;
        }
        .heart {
            font-size: 45px;
            margin: 10px 0;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        p {
            color: #000000;
            font-weight: 700;
        }
        .counter-box {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            background: #ffa6b5;
            padding: 12px;
            border-radius: 14px;
            border: 1px solid #ff8093;
        }
        .time-unit span {
            display: block;
            font-size: 20px;
            font-weight: 800;
            color: #000000;
        }
        .time-unit label {
            font-size: 12px;
            color: #222222;
            font-weight: 700;
        }
        .settings-box {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #ff8093;
        }
        input[type="date"], input[type="text"], input[type="file"], textarea {
            padding: 8px;
            border-radius: 10px;
            border: 1px solid #ff8093;
            background: #fff0f3;
            font-family: 'Almarai', sans-serif;
            color: #000000;
            outline: none;
            font-weight: 700;
            width: 90%;
            margin-bottom: 8px;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            background-color: #000000;
            color: #ffffff;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Almarai', sans-serif;
            font-weight: 700;
            transition: 0.2s;
        }
        button:hover {
            background-color: #333333;
        }
        .nav-buttons {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .nav-btn {
            background-color: #000000;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            border: none;
        }
        .nav-btn:hover {
            background-color: #333333;
        }
        .page {
            display: none !important;
        }
        .page.active {
            display: flex !important;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            flex-grow: 1;
        }
        .slide-card {
            background: #fff0f3;
            border-radius: 14px;
            padding: 10px;
            border: 1px solid #ff8093;
            margin-top: 10px;
        }
        .slide-card img {
            width: 100%;
            height: 200px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 8px;
        }
        .slider-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
        }
        .delete-btn {
            background-color: #d9534f !important;
            font-size: 11px;
            padding: 5px 10px;
            width: 100%;
        }
        .back-btn {
            background-color: #000000;
            color: white;
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            border-radius: 10px;
        }
        #auth-screen {
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- شاشة إدخال كود الربط السري -->
        <div id="auth-screen" class="page active">
            <div>
                <h1>ربط التطبيق ❤️</h1>
                <p style="font-size: 13px; margin-bottom: 15px;">اكتبوا نفس الكود السري المشترك بينكم أنتم الاتنين عشان تبدأوا:</p>
                <input type="text" id="roomCodeInput" placeholder="مثلاً: love2026" style="text-align: center;">
                <br>
                <button onclick="connectRoom()" style="width: 95%; margin-top: 10px; padding: 12px;">دخول للذكريات ✨</button>
            </div>
            <div></div>
        </div>

        <!-- الشاشة الأولى: العداد الرئيسي -->
        <div id="home-page" class="page">
            <div>
                <h1>مع بعض في كل خطوة ❤️</h1>
                <div class="heart">❤️</div>
                <p>بدأنا حكايتنا من تاريخ: <br><b id="date-display" style="direction: ltr; display: inline-block; color: #000000;">2025-01-01</b></p>
                
                <div class="counter-box">
                    <div class="time-unit">
                        <span id="days">0</span>
                        <label>يوم</label>
                    </div>
                    <div class="time-unit">
                        <span id="hours">0</span>
                        <label>ساعة</label>
                    </div>
                    <div class="time-unit">
                        <span id="minutes">0</span>
                        <label>دقيقة</label>
                    </div>
                    <div class="time-unit">
                        <span id="seconds">0</span>
                        <label>ثانية</label>
                    </div>
                </div>

                <div class="settings-box">
                    <label style="font-size: 12px; display: block; margin-bottom: 5px; color: #000000; font-weight: 700;">اختر تاريخ البداية:</label>
                    <input type="date" id="startDateInput">
                    <br>
                    <button onclick="saveDate()" style="margin-top: 5px;">حفظ التاريخ</button>
                </div>
            </div>

            <div class="nav-buttons">
                <button class="nav-btn" onclick="switchPage('gallery-page')">الدخول لألبوم الصور 📸</button>
                <button class="nav-btn" onclick="switchPage('wishes-page')">قائمة الأمنيات 📝</button>
            </div>
        </div>

        <!-- الشاشة الثانية: ألبوم الصور -->
        <div id="gallery-page" class="page">
            <div>
                <h1>ألبوم الذكريات 📸</h1>
                <div class="slide-card">
                    <img id="slide-image" src="" alt="صورة الذكرى">
                    <p id="slide-text" style="font-size: 13px; margin: 5px 0;">جاري تحميل الذكريات... ✨</p>
                    <div class="slider-buttons">
                        <button onclick="prevSlide()" style="padding: 5px 10px; font-size: 12px;">السابق</button>
                        <span id="slide-counter" style="color: #000; font-size: 11px; font-weight: bold;">0 / 0</span>
                        <button onclick="nextSlide()" style="padding: 5px 10px; font-size: 12px;">التالي</button>
                    </div>
                    <button class="delete-btn" onclick="deleteCurrentMemory()">حذف هذه الصورة 🗑️</button>
                </div>

                <div class="settings-box" style="margin-top: 10px;">
                    <label style="font-size: 11px; display: block; margin-bottom: 3px; color: #000000; font-weight: 700;">إضافة ذكرى جديدة:</label>
                    <input type="file" id="imageInput" accept="image/*">
                    <input type="text" id="captionInput" placeholder="اكتب جملة للذكرى...">
                    <button onclick="addNewMemory()" style="margin-top: 3px;">إضافة للألبوم</button>
                </div>
            </div>

            <button class="back-btn" onclick="switchPage('home-page')">الرجوع للرئيسية 🏠</button>
        </div>

        <!-- الشاشة الثالثة: قائمة الأمنيات -->
        <div id="wishes-page" class="page">
            <div>
                <h1>قائمة الأمنيات 📝</h1>
                <p style="font-size: 12px; margin-bottom: 5px;">اكتب أمنياتك واحفظها:</p>
                <textarea id="wishNoteInput" placeholder="اكتب هنا كل اللي في بالك..."></textarea>
                <br>
                <button onclick="saveWishNote()" style="width: 100%; margin-top: 5px;">حفظ القائمة 💾</button>
            </div>

            <button class="back-btn" onclick="switchPage('home-page')">الرجوع للرئيسية 🏠</button>
        </div>

    </div>

    <!-- سكربتات Firebase مع ضغط الصور تلقائياً -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDbzZ37lFWDTU8cADaltjaK9SnCkguHqr4",
            authDomain: "loveapp-f3848.firebaseapp.com",
            projectId: "loveapp-f3848",
            storageBucket: "loveapp-f3848.firebasestorage.app",
            messagingSenderId: "585541103196",
            appId: "1:585541103196:web:5d1b3724b6a0c6f89e4099",
            measurementId: "G-CDWLKQHWFJ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentRoom = "";
        let unsubscribers = [];
        let activeStartDate = "2025-01-01";
        let memories = [];
        let currentIndex = 0;

        window.switchPage = function(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        window.connectRoom = function() {
            const code = document.getElementById("roomCodeInput").value.trim();
            if (!code) {
                alert("من فضلك اكتب كود سري للربط!");
                return;
            }
            currentRoom = code;
            
            unsubscribers.forEach(unsub => unsub());
            unsubscribers = [];

            switchPage('home-page');
            initListeners();
        }

        function initListeners() {
            const unsub1 = onSnapshot(doc(db, "rooms", currentRoom), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (data.startDate) {
                        activeStartDate = data.startDate;
                        document.getElementById("startDateInput").value = activeStartDate;
                        document.getElementById("date-display").innerText = activeStartDate;
                    }
                    if (data.memories) {
                        memories = data.memories;
                        if (currentIndex >= memories.length) currentIndex = Math.max(0, memories.length - 1);
                        showSlide(currentIndex);
                    }
                    if (data.wishes !== undefined && document.activeElement !== wishNoteInput) {
                        wishNoteInput.value = data.wishes;
                    }
                }
            });
            unsubscribers.push(unsub1);

            window.updateRoomData = async function(newData) {
                try {
                    await setDoc(doc(db, "rooms", currentRoom), newData, { merge: true });
                } catch (e) {
                    console.error("خطأ في الحفظ:", e);
                    alert("حدث خطأ أثناء الحفظ، قد تكون حجم البيانات كبيرة جداً.");
                }
            }
        }

        window.saveDate = async function() {
            const inputVal = document.getElementById("startDateInput").value;
            if (inputVal && currentRoom) {
                await updateRoomData({ startDate: inputVal });
                activeStartDate = inputVal;
                document.getElementById("date-display").innerText = inputVal;
                alert("تم حفظ وتحديث التاريخ بنجاح! ✨");
            }
        }

        function updateTimer() {
            const startDate = new Date(activeStartDate + "T00:00:00");
            const now = new Date();
            const diff = now - startDate;

            if (diff < 0) {
                document.getElementById("days").innerText = 0;
                document.getElementById("hours").innerText = 0;
                document.getElementById("minutes").innerText = 0;
                document.getElementById("seconds").innerText = 0;
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            document.getElementById("days").innerText = days;
            document.getElementById("hours").innerText = hours;
            document.getElementById("minutes").innerText = minutes;
            document.getElementById("seconds").innerText = seconds;
        }
        setInterval(updateTimer, 1000);

        function showSlide(index) {
            const imgElement = document.getElementById("slide-image");
            const textElement = document.getElementById("slide-text");
            const counterElement = document.getElementById("slide-counter");
            const deleteBtn = document.querySelector(".delete-btn");

            if (!memories || memories.length === 0) {
                imgElement.style.display = "none";
                textElement.innerText = "لا توجد صور مضافة بعد، جرب تضيف صورة بالأسفل! ✨";
                counterElement.innerText = "0 / 0";
                deleteBtn.style.display = "none";
                return;
            }

            imgElement.style.display = "block";
            deleteBtn.style.display = "block";
            imgElement.src = memories[index].img;
            textElement.innerText = memories[index].text;
            counterElement.innerText = `${index + 1} / ${memories.length}`;
        }

        window.nextSlide = function() {
            if (memories.length === 0) return;
            currentIndex = (currentIndex + 1) % memories.length;
            showSlide(currentIndex);
        }

        window.prevSlide = function() {
            if (memories.length === 0) return;
            currentIndex = (currentIndex - 1 + memories.length) % memories.length;
            showSlide(currentIndex);
        }

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    const MAX_HEIGHT = 800;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    callback(dataUrl);
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.addNewMemory = function() {
            const fileInput = document.getElementById("imageInput");
            const captionInput = document.getElementById("captionInput");

            if (fileInput.files && fileInput.files[0]) {
                compressImage(fileInput.files[0], async function(compressedDataUrl) {
                    const newMemory = {
                        img: compressedDataUrl,
                        text: captionInput.value || "ذكرى جميلة ❤️"
                    };
                    memories.push(newMemory);
                    await updateRoomData({ memories: memories });
                    currentIndex = memories.length - 1;
                    showSlide(currentIndex);
                    fileInput.value = "";
                    captionInput.value = "";
                    alert("تمت إضافة الذكرى وحفظها بنجاح! 🎉");
                });
            } else {
                alert("من فضلك اختر صورة أولاً! 📸");
            }
        }

        window.deleteCurrentMemory = async function() {
            if (memories.length === 0) return;
            if (confirm("متأكد إنك عايز تحذف الصورة دي؟")) {
                memories.splice(currentIndex, 1);
                if (currentIndex >= memories.length) currentIndex = Math.max(0, memories.length - 1);
                await updateRoomData({ memories: memories });
                showSlide(currentIndex);
                alert("تم حذف الصورة بنجاح 🗑️");
            }
        }

        const wishNoteInput = document.getElementById("wishNoteInput");

        window.saveWishNote = async function() {
            try {
                await updateRoomData({ wishes: wishNoteInput.value });
                alert("تم حفظ قائمة الأمنيات بنجاح! 💾✨");
            } catch (e) {
                alert("حدث خطأ أثناء حفظ الأمنيات.");
            }
        }
    </script>

</body>
</html>
